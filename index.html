  <!-- Resolve the theme BEFORE first paint, otherwise a light-theme visitor
       sees a dark flash while the bundle loads. Stored choice wins over the OS
       preference; both are wrapped because storage can be blocked. -->
  <script>
    (function () {
      try {
        var stored = null;
        try { stored = localStorage.getItem('cy_theme'); } catch (e) {}
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = stored || (prefersLight ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f8fafc' : '#0b1120');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
